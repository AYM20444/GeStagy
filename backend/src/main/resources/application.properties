spring.application.name=gestagy-backend

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Database Configuration (PostgreSQL with graceful H2 dev profile)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestagy_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File Upload Configuration
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB
app.storage.upload-dir=./uploads

# Security / JWT Configuration
app.jwt.secret=9a7c8b2d1e4f3a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b
app.jwt.expiration-ms=86400000

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

